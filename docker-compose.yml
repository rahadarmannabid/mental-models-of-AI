services:
  redis:
    image: redis:7-alpine
    container_name: codeoracle_redis
    restart: unless-stopped
    networks:
      - guessing_ide_network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  guessing_ide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guessing_ide
    image: rahadarmannabid/mental-model-of-ai:latest
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      runner:
        condition: service_started

    env_file:
      - .env

    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=info
      # Default to bundled Redis; set REDIS_URL in .env to use managed Redis instead.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Student code runs in the separate `runner` container below.
      - RUNNER_URL=http://runner:8100

    volumes:
      # ONLY mount directories for OUTPUT/RUNTIME DATA
      - ./submissions:/app/submissions
      - ./session_logs:/app/session_logs
      - ./logs:/app/logs
      
      # ❌ REMOVED - These will come from Docker image:
      # - ./starter_code:/app/starter_code:ro
      # - ./surveys:/app/surveys:ro
      # - ./assignment:/app/assignment:ro
      # - ./templates:/app/templates:ro
    
    networks:
      - guessing_ide_network
      - runner_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Runs student code. Deliberately gets NO env_file: it must never see API keys or Firebase
  # credentials. Internal network only (no internet). Each program runs as the unprivileged
  # `sandbox` user (SANDBOX_UID) with CPU/memory/output/process limits from sandbox.py.
  runner:
    image: rahadarmannabid/mental-model-of-ai:latest
    container_name: codeoracle_runner
    command: ["uvicorn", "runner:app", "--host", "0.0.0.0", "--port", "8100", "--log-level", "warning"]
    user: root  # only to switch each student program to SANDBOX_UID
    environment:
      - RUNNER_TOKEN=${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env (openssl rand -hex 32)}
      - SANDBOX_UID=10001
      - CODE_MAX_CONCURRENT=${CODE_MAX_CONCURRENT:-40}
      - CODE_MEMORY_MB=${CODE_MEMORY_MB:-256}
      # `pip install` in the terminal: per-session packages on a disk volume, downloaded from PyPI
      # through the app (this network has no internet). Removed when the student submits.
      - SANDBOX_PKG_DIR=/var/lib/sandbox-pkgs
      - PIP_INDEX_URL=http://runner:${RUNNER_TOKEN}@guessing_ide:8000/pypi/simple/
      - PIP_TRUSTED_HOST=guessing_ide
    volumes:
      - runner_pkgs:/var/lib/sandbox-pkgs
    networks:
      - runner_network
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    pids_limit: 1024
    mem_limit: 8g
    cpus: 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  runner_pkgs:

networks:
  guessing_ide_network:
    driver: bridge
    name: guessing_ide_network
  runner_network:
    driver: bridge
    internal: true  # no route to the internet
    name: runner_network