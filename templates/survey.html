            openImageModal(src, alt) {
                let modal = document.getElementById('imageModal');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'imageModal';
                    modal.className = 'image-modal';
                    modal.innerHTML = `
                        <span class="image-modal-close">&times;</span>
                        <img class="image-modal-content" id="modalImage" alt="">
                    `;
                    document.body.appendChild(modal);
                    
                    modal.querySelector('.image-modal-close').onclick = () => {
                        modal.classList.remove('active');
                    };
                    modal.onclick = (e) => {
                        if (e.target === modal) {
                            modal.classList.remove('active');
                        }
                    };
                    
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && modal.classList.contains('active')) {
                            modal.classList.remove('active');
                        }
                    });
                }
                
                const modalImg = document.getElementById('modalImage');
                modalImg.src = src;
                modalImg.alt = alt;
                modal.classList.add('active');
            }

            /** Resolve stored answer for a question (IDs may be number in config, string in API/localStorage). */
            getAnswerForQuestion(q) {
                if (!q) return undefined;
                if (q.type === 'diagram') {
                    const w = this.diagramWidgets[String(q.id)];
                    if (w && !w.getAnswer() && !w.isEmpty()) return 'pending_diagram';
                }
                let v = this.responses[q.id];
                if (v === undefined || v === null) v = this.responses[String(q.id)];
                if (v === undefined || v === null) return undefined;
                return this.isAnswerComplete(q, v) ? v : undefined;
            }

            handleResponse(questionId, answer) {
                this.responses[questionId] = answer;
                
                // Add visual feedback - mark question as answered
                const questionElement = this.findQuestionElement(questionId);
                if (questionElement) {
                    questionElement.classList.add('answered');
                }
                
                this.updateProgress();
                this.schedulePersistSurveyDraft();
            }

            updateProgress() {
                // Exclude info_block from total count
                const totalQuestions = this.surveyConfig.questions.filter(q => q.type !== 'info_block').length;
                const answeredQuestions = this.surveyConfig.questions.filter(q => {
                    if (q.type === 'info_block') return false;
                    const v = this.getAnswerForQuestion(q);
                    return v !== undefined && v !== null;
                }).length;
                const progress = totalQuestions ? (answeredQuestions / totalQuestions) * 100 : 0;

                document.getElementById('progressFill').style.width = `${progress}%`;
                this.updateProgressLabel(totalQuestions, answeredQuestions);

                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    // Only required questions block submission
                    const requiredQuestions = this.surveyConfig.questions.filter(q => q.type !== 'info_block' && q.required !== false);
                    const answeredRequired = requiredQuestions.filter(q => {
                        const v = this.getAnswerForQuestion(q);
                        return v !== undefined && v !== null;
                    }).length;
                    submitBtn.disabled = answeredRequired < requiredQuestions.length;
                }
            }

            /** "Question 3–4 of 17 · 2 answered · 15 left" above the progress bar. */
            updateProgressLabel(total, answered) {
                const el = document.getElementById('progressLabel');
                if (!el) return;
                if (!total || !this.pages) { el.textContent = ''; return; }
                let first = 0;
                for (let p = 0; p < this.currentPage; p++) {
                    first += this.pages[p].filter((q) => q.type !== 'info_block').length;
                }
                const onPage = (this.pages[this.currentPage] || []).filter((q) => q.type !== 'info_block').length;
                const range = onPage > 1 ? `${first + 1}–${first + onPage}` : `${Math.min(first + 1, total)}`;
                document.getElementById('progressPosition').textContent = `Question ${range} of ${total}`;
                const left = total - answered;
                document.getElementById('progressCount').textContent =
                    left ? `${answered} answered · ${left} left` : 'All questions answered';
                el.style.display = '';
            }

            async updateSurveyStatus(status) {
                try {
                    const response = await fetch(`/update-survey-status?session_id=${this.sessionId}&survey_type=${this.surveyType}&status=${status}`, {
                        method: 'POST'
                    });
                    if (!response.ok) throw new Error('Failed to update status');
                } catch (error) {
                    console.error('Status update error:', error);
                }
            }

            setupEventListeners() {
                document.getElementById('submitBtn').addEventListener('click', () => this.submitSurvey());
                document.getElementById('nextBtn').addEventListener('click', () => this.goToNextPage());
                let fitTimer = null;
                window.addEventListener('resize', () => {
                    clearTimeout(fitTimer);
                    fitTimer = setTimeout(() => this.fitDiagramsToWindow(false), 150);
                });
                document.getElementById('prevBtn').addEventListener('click', () => {
                    this.hideError();
                    this.showPage(this.currentPage - 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                // Flush draft synchronously when leaving (IDE, back button, refresh) — debounced save may not have run.
                window.addEventListener('pagehide', () => {
                    try {
                        this.persistSurveyDraft();
                        this.flushSurveyDraftToServer(true);
                    } catch (e) { /* ignore */ }
                });
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        try {
                            this.persistSurveyDraft();
                            this.flushSurveyDraftToServer(true);
                        } catch (e) { /* ignore */ }
                    }
                });

                window.addEventListener('beforeunload', (e) => {
                    try {
                        this.persistSurveyDraft();
                        this.flushSurveyDraftToServer(true);
                    } catch (err) { /* ignore */ }
                    if (allowNavigation) {
                        return undefined;
                    }
                    
                    if (Object.keys(this.responses).length > 0) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
            }

            async submitSurvey() {
                if (!(await this.saveDiagramsBeforeSubmit())) {
                    this.showError('A diagram could not be saved to the server. Check your connection and click "Save diagram" again.');
                    return;
                }
                const requiredQuestions = this.surveyConfig.questions.filter(q => q.required !== false && q.type !== 'info_block');
                const unansweredRequired = requiredQuestions.filter(q => {
                    const v = this.getAnswerForQuestion(q);
                    if (v === undefined || v === null) return true;
                    if (typeof v === 'string' && !v.trim()) return true;
                    return false;
                });
                
                if (unansweredRequired.length > 0) {
                    const p = this.pageOfQuestion(unansweredRequired[0]);
                    if (p >= 0 && p !== this.currentPage) this.showPage(p);
                    this.showError(`Please answer all required questions (${unansweredRequired.length} remaining).`, 'warning');
                    return;
                }
                
                const invalidLengths = [];
                for (const question of this.surveyConfig.questions) {
                    if (question.type === 'open_ended' && question.min_length) {
                        const response = this.getAnswerForQuestion(question);
                        if (response && response.trim().length < question.min_length) {
                            invalidLengths.push({
                                id: question.id,
                                minLength: question.min_length,
                                currentLength: response.trim().length
                            });
                        }
                    }
                }
                
                if (invalidLengths.length > 0) {
                    const firstInvalid = invalidLengths[0];
                    this.showError(`Some answers are too short. Please provide at least ${firstInvalid.minLength} characters for all text responses.`, 'warning');
                    return;
                }

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';

                try {
                    const completionTime = (Date.now() - this.startTime) / 1000;

                    const submission = {
                        user_id: this.userId,
                        session_id: this.sessionId,
                        assignment_key: this.assignmentKey,
                        survey_type: this.surveyType,
                        survey_title: this.surveyConfig.title,
                        survey_description: this.surveyConfig.description,
                        // FIXED: Filter out info_block from questions too
                        questions: this.surveyConfig.questions.filter(q => q.type !== 'info_block').map(q => ({
                            id: q.id,
                            type: q.type,
                            question: q.question,
                            required: q.required !== false,
                            scale: q.scale || null,
                            options: q.options || null,
                            placeholder: q.placeholder || null,
                            max_length: q.max_length || null,
                            help_text: q.help_text || null,
                            allow_other: q.allow_other || null,
                            other_label: q.other_label || null,
                            rows: q.rows || null,
                            columns: q.columns || null,
                            diagram: q.diagram || null
                        })),
                        responses: this.surveyConfig.questions.filter(q => q.type !== 'info_block').map(q => ({
                            question_id: q.id,
                            question_text: q.question,
                            question_type: q.type,
                            question_config: {
                                scale: q.scale,
                                options: q.options,
                                placeholder: q.placeholder,
                                max_length: q.max_length,
                                min_length: q.min_length,
                                help_text: q.help_text,
                                allow_other: q.allow_other,
                                rows: q.rows,
                                columns: q.columns,
                                diagram: q.diagram
                            },
                            answer: this.responses[q.id] || null,
                            required: q.required !== false
                        })),
                        timestamp: new Date().toISOString(),
                        total_questions: this.surveyConfig.questions.filter(q => q.type !== 'info_block').length,
                        required_questions: requiredQuestions.length,
                        completion_time_seconds: completionTime
                    };

                    const response = await fetch('/submit-pre-post-survey', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submission)
                });

                    if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ SERVER ERROR:', {
                        status: response.status,
                        statusText: response.statusText,
                        responseBody: errorText
                    });
                    
                    // Try to parse as JSON for more details
                    try {
                        const errorJson = JSON.parse(errorText);
                        console.error('❌ ERROR DETAILS:', errorJson);
                        throw new Error(`Submission failed (${response.status}): ${errorJson.detail || errorText}`);
                    } catch (parseError) {
                        throw new Error(`Submission failed (${response.status}): ${errorText.substring(0, 200)}`);
                    }
                }
                    await this.updateSurveyStatus('completed');
                    this.clearSurveyDraft();
                    Object.values(this.diagramWidgets).forEach((w) => w.clearDraft());
                    try { sessionStorage.removeItem(this.getPageStorageKey()); } catch (e) { /* ignore */ }

                    const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    const sessionToken = authData.sessionToken;
                    const userId = authData.userId;

                    if (this.surveyType === 'pre') {
                        allowNavigation = true;
                        window.location.href = `/index.html?session=${sessionToken}&user=${encodeURIComponent(userId)}`;
                        
                    } else if (this.surveyType === 'post') {
                        // Align quiz progress with server — stale sessionStorage breaks hasMoreProblems and /quiz/next-problem.
                        try {
                            const stRes = await fetch('/survey-status/' + encodeURIComponent(this.sessionId) + '?t=' + Date.now() + '&problem_index=' + encodeURIComponent(String(this.problemIndex)), { cache: 'no-store' });
                            if (stRes.ok) {
                                const st = await stRes.json();
                                if (typeof st.current_problem_index === 'number') {
                                    authData.currentProblemIndex = st.current_problem_index;
                                }
                                if (typeof st.total_problems === 'number' && st.total_problems >= 1) {
                                    authData.totalProblems = st.total_problems;
                                }
                                sessionStorage.setItem('authData', JSON.stringify(authData));
                            }
                        } catch (e) {
                            console.warn('survey-status sync failed', e);
                        }

                        const isSubmissionPending = sessionStorage.getItem('postSurveySubmissionPending') === 'true';

                        // Check if there are more problems in this multi-problem quiz (coerce — string/JSON can break comparisons)
                        const totalProblems = Math.max(1, Math.floor(Number(authData.totalProblems)) || 1);
                        const currentProbIdx = Math.max(0, Math.floor(Number(authData.currentProblemIndex)) || 0);
                        // Advance when there are more problems — don't gate solely on postSurveySubmissionPending
                        // so that even if the flag was lost (race, manual nav, etc.) the sequence is preserved.
                        const hasMoreProblems = (currentProbIdx < totalProblems - 1);
                        /** True when /quiz/next-problem returned status complete while we still expected another problem — must run final submission block below. */
                        let nextProblemReturnedComplete = false;

                        if (hasMoreProblems) {
                            // Multi-problem quiz: advance to next problem
                            // Do not clear postSurveySubmissionPending until next-problem succeeds or final block runs — avoids stuck state if fetch hangs/fails.
                            submitBtn.textContent = 'Loading Next Problem...';

                            try {
                                const cachedData = this.retrieveCachedSubmissionData();
                                const code = (cachedData && cachedData.code) ? cachedData.code : '';

                                const nextFetchInit = {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        session_id: authData.sessionId,
                                        code: code,
                                        programming_language: authData.programmingLanguage || 'python',
                                        current_problem_index: currentProbIdx,
                                    })
                                };
                                const nextRes = await surveyFetchWithTimeout('/quiz/next-problem', nextFetchInit, 120000);

                                if (!nextRes.ok) throw new Error('Failed to load next problem');
                                const nextData = await nextRes.json();


                                if (nextData.status === 'complete') {
                                    // All problems done — fall through to final submission
                                    throw new Error('__ALL_DONE__');
                                }

                                if (nextData.status !== 'next') {
                                    throw new Error(nextData.detail || nextData.message || 'Unexpected response from server');
                                }

                                // Store current problem's code for combined download at final submission.
                                // Use localStorage so the codes survive a tab close / crash.
                                const perProblemKey = `perProblemCodes_${authData.sessionId}`;
                                let stored = [];
                                try {
                                    const raw = localStorage.getItem(perProblemKey);
                                    if (raw) stored = JSON.parse(raw);
                                } catch (e) {}
                                stored.push({
                                    problemIndex: currentProbIdx,
                                    title: nextData.completed_problem_title || `Problem ${currentProbIdx + 1}`,
                                    code: code
                                });
                                localStorage.setItem(perProblemKey, JSON.stringify(stored));

                                // Update authData with next problem info
                                authData.currentProblemIndex = nextData.problem_index;
                                authData.problemDescription = nextData.problem_description;
                                authData.starterCode = nextData.starter_code;
                                authData.starterFiles = nextData.starter_files;
                                // Update per-problem survey flags
                                authData.hasPreSurvey = nextData.has_pre_survey || false;
                                authData.hasPostSurvey = nextData.has_post_survey || false;
                                authData.periodicSurveyEnabled = nextData.periodic_survey_enabled === true;
                                authData.periodicSurveyStart = nextData.periodic_survey_start || 5;
                                authData.periodicSurveyInterval = nextData.periodic_survey_interval || 4;
                                sessionStorage.setItem('authData', JSON.stringify(authData));

                                this.clearCachedSubmissionData();

                                // Clear autosave so previous problem's code doesn't persist
                                const autosaveKey = `ide_autosave_${userId}_${authData.sessionId}`;
                                localStorage.removeItem(autosaveKey);

                                // Clear periodic survey storage so recurrent survey resets fresh
                                sessionStorage.removeItem(`periodicSurveys_${authData.sessionId}`);

                                submitBtn.textContent = 'Next Problem Ready!';
                                await new Promise(resolve => setTimeout(resolve, 800));

                                sessionStorage.removeItem('postSurveySubmissionPending');
                                allowNavigation = true;
                                // If next problem has a pre-survey, go there first
                                if (authData.hasPreSurvey) {
                                    window.location.href = `/survey.html?type=pre&session=${sessionToken}&user=${encodeURIComponent(userId)}`;
                                } else {
                                    window.location.href = `/index.html?session=${sessionToken}&user=${encodeURIComponent(userId)}`;
                                }

                            } catch (error) {
                                if (error.message === '__ALL_DONE__') {
                                    nextProblemReturnedComplete = true;
                                    // Fall through to final submission below
                                } else {
                                    console.error('Next problem error:', error);
                                    var errMsg = error && error.name === 'AbortError' ? 'Request timed out. Check your connection and try again.' : error.message;
                                    this.showError('Failed to load next problem: ' + errMsg);
                                    submitBtn.disabled = false;
                                    submitBtn.textContent = 'Retry';
                                    return;
                                }
                            }
                        }

                        if (!hasMoreProblems || nextProblemReturnedComplete) {
                            // Final problem, single-problem quiz, or server returned complete while advancing (nextProblemReturnedComplete)
                            sessionStorage.removeItem('postSurveySubmissionPending');

                            submitBtn.textContent = 'Downloading Your Code...';

                            try {
                                let cachedData = this.retrieveCachedSubmissionData();
                                if (!cachedData) {
                                    cachedData = this.buildSubmissionDataFromPerProblemStorageFallback();
                                }

                                submitBtn.textContent = 'Downloading Your Code...';
                                // ZIP includes per-problem codes from localStorage + snapshot; works even if sessionStorage was cleared.
                                if (cachedData) {
                                    await this.downloadCodeFromCache(cachedData);
                                    await new Promise(resolve => setTimeout(resolve, 1500));
                                }

                                submitBtn.textContent = 'Submitting Your Code...';

                                if (!cachedData) {
                                    throw new Error('Could not find submission data. Please return to the IDE, click Submit once, then complete the post-survey again.');
                                }

                                const periodicSurveysData = this.restorePeriodicSurveysFromStorage();

                                const codeResponse = await fetch('/submit', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                    },
                                    body: JSON.stringify({
                                        code: cachedData.code,
                                        files: cachedData.files || null,
                                        user_id: cachedData.session.userId,
                                        assignment_key: cachedData.session.assignmentKey,
                                        session_id: cachedData.session.sessionId,
                                        programming_language: cachedData.session.programmingLanguage,
                                        timestamp: new Date().toISOString(),
                                        suggestion_clicked: cachedData.metrics.suggestionClicks,
                                        compiler_clicked: cachedData.metrics.compilerClicks,
                                        session_metadata: cachedData.session,
                                        activity_logs: cachedData.activity.allActivityLogs,
                                        activity_summary: cachedData.metrics,
                                        survey_data: periodicSurveysData || cachedData.surveys
                                    })
                                });

                                if (!codeResponse.ok) {
                                    throw new Error('Code submission failed');
                                }

                                const result = await codeResponse.json();

                                this.clearCachedSubmissionData();
                                this.clearAllSessionCodes();
                                this.clearPeriodicSurveysFromStorage();
                                sessionStorage.removeItem('authData');

                                submitBtn.textContent = '✅ All Data Submitted!';
                                this.showError(`Survey and code submitted successfully!\n\nSubmission ID: ${result.submission_id}\nDatabase Status: ${result.firebase_status}`, 'success');

                                await new Promise(resolve => setTimeout(resolve, 3000));

                                allowNavigation = true;
                                window.location.href = '/home.html';

                            } catch (error) {
                                console.error('Code submission error:', error);
                                this.showError('Code submission failed: ' + error.message);
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Retry Submission';
                            }

                        }
                    }

                } catch (error) {
                    console.error('Submission error:', error);
                    this.showError('Failed to submit survey. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Survey';
                }
            }

            retrieveCachedSubmissionData() {
                try {
                    const cached = sessionStorage.getItem('pendingSubmissionData');
                    if (cached) {
                        return JSON.parse(cached);
                    }
                    const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    const sid = authData.sessionId;
                    if (sid) {
                        const bak = localStorage.getItem('quizLastSubmissionData_' + sid);
                        if (bak) {
                            return JSON.parse(bak);
                        }
                    }
                    return this.buildSubmissionDataFromPerProblemStorageFallback();
                } catch (error) {
                    console.error('Failed to retrieve cached data:', error);
                    return this.buildSubmissionDataFromPerProblemStorageFallback();
                }
            }

            /** Last resort when sessionStorage/localStorage snapshot was cleared: codes in perProblemCodes_ + authData. */
            buildSubmissionDataFromPerProblemStorageFallback() {
                try {
                    const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    const sid = authData.sessionId;
                    if (!sid || !authData.userId || !authData.assignmentKey) return null;
                    const perProblemKey = 'perProblemCodes_' + sid;
                    let stored = [];
                    try {
                        const raw = localStorage.getItem(perProblemKey);
                        if (raw) stored = JSON.parse(raw);
                    } catch (e) {}
                    if (!Array.isArray(stored) || !stored.length) return null;
                    stored.sort((a, b) => a.problemIndex - b.problemIndex);
                    const last = stored[stored.length - 1];
                    const pi = typeof last.problemIndex === 'number' ? last.problemIndex : 0;
                    const code = (last.code != null ? last.code : '') || '';
                    const files = last.files && last.files.length ? last.files : null;
                    if (!code.trim() && (!files || !files.length)) return null;
                    return {
                        code: code,
                        files: files,
                        lineCount: 0,
                        characterCount: code.length,
                        currentProblemIndex: pi,
                        currentProblemTitle: last.title || `Problem ${pi + 1}`,
                        totalProblems: authData.totalProblems || 1,
                        session: {
                            sessionId: sid,
                            userId: authData.userId,
                            assignmentKey: authData.assignmentKey,
                            sessionToken: authData.sessionToken,
                            condition: authData.condition,
                            programmingLanguage: authData.programmingLanguage || 'python',
                            quizId: authData.quizId || null,
                            startTime: authData.timestamp,
                            endTime: new Date().toISOString()
                        },
                        activity: { allActivityLogs: [], guessHistory: [], descHistory: [], suggestionsHistory: [], suggestionResponses: [] },
                        metrics: {
                            totalKeystrokes: 0,
                            focusTime: 0,
                            awayTime: 0,
                            totalAIAnalyses: 0,
                            suggestionClicks: 0,
                            compilerClicks: 0,
                            peakCodeLines: 0
                        },
                        surveys: { periodicSurveys: [], totalOccurrences: 0, totalAnalyses: 0 },
                        capturedAt: new Date().toISOString(),
                        _fallbackFromPerProblemStorage: true
                    };
                } catch (e) {
                    console.warn('buildSubmissionDataFromPerProblemStorageFallback', e);
                    return null;
                }
            }

            clearCachedSubmissionData() {
                try {
                    sessionStorage.removeItem('pendingSubmissionData');
                    try {
                        const ad = JSON.parse(sessionStorage.getItem('authData') || '{}');
                        if (ad.sessionId) {
                            localStorage.removeItem('quizLastSubmissionData_' + ad.sessionId);
                        }
                    } catch (e) {}
                    // perProblemCodes_ is intentionally NOT cleared here — it accumulates codes
                    // across all problems and must survive until the final post-quiz download + submit.
                } catch (error) {
                    console.error('Failed to clear cached data:', error);
                }
            }

            clearAllSessionCodes() {
                try {
                    const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    const cachedData = this.retrieveCachedSubmissionData();
                    const sessionId = (cachedData && cachedData.session && cachedData.session.sessionId)
                        || authData.sessionId;
                    if (sessionId) {
                        localStorage.removeItem(`perProblemCodes_${sessionId}`);
                        localStorage.removeItem('quizLastSubmissionData_' + sessionId);
                    }
                } catch (error) {
                    console.error('Failed to clear per-problem codes:', error);
                }
            }

            async downloadCodeFromCache(cachedData) {
                try {
                    const lang = cachedData.session.programmingLanguage || 'javascript';
                    const ext = surveyExtensionForLanguage(lang);
                    const timestampSeg = surveyDownloadTimestampSegment();
                    const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    const quizId = cachedData.session.quizId || authData.quizId || null;
                    const currentProbIdx = authData.currentProblemIndex || 0;
                    const uid = cachedData.session.userId;
                    const akey = cachedData.session.assignmentKey;

                    const perProblemKey = `perProblemCodes_${cachedData.session.sessionId}`;
                    let stored = [];
                    try {
                        // localStorage so codes survive tab closes / crashes
                        const raw = localStorage.getItem(perProblemKey);
                        if (raw) stored = JSON.parse(raw);
                    } catch (e) {}
                    stored.sort((a, b) => a.problemIndex - b.problemIndex);

                    const entries = [];

                    function pushStoredProblem(p) {
                        const problemNum = p.problemIndex + 1;
                        const stem = surveyBuildStemForProblem(uid, akey, quizId, problemNum, timestampSeg);
                        if (p.files && Array.isArray(p.files) && p.files.length > 1) {
                            for (let i = 0; i < p.files.length; i++) {
                                entries.push({
                                    filename: `${stem}_${i + 1}${ext}`,
                                    content: (p.files[i] && p.files[i].content) ? p.files[i].content : ''
                                });
                            }
                        } else if (p.files && p.files.length === 1) {
                            entries.push({ filename: `${stem}${ext}`, content: (p.files[0].content || '').trim() });
                        } else {
                            entries.push({ filename: `${stem}${ext}`, content: (p.code || '').trim() });
                        }
                    }

                    for (const p of stored) {
                        pushStoredProblem(p);
                    }

                    const hasStoredForCurrent = stored.some((p) => p.problemIndex === currentProbIdx);
                    if (!hasStoredForCurrent) {
                        const problemNum = currentProbIdx + 1;
                        const stem = surveyBuildStemForProblem(uid, akey, quizId, problemNum, timestampSeg);
                        if (cachedData.files && Array.isArray(cachedData.files) && cachedData.files.length > 0) {
                            if (cachedData.files.length === 1) {
                                entries.push({ filename: `${stem}${ext}`, content: cachedData.files[0].content || '' });
                            } else {
                                for (let i = 0; i < cachedData.files.length; i++) {
                                    entries.push({
                                        filename: `${stem}_${i + 1}${ext}`,
                                        content: cachedData.files[i].content || ''
                                    });
                                }
                            }
                        } else {
                            entries.push({ filename: `${stem}${ext}`, content: (cachedData.code || '').trim() });
                        }
                    }

                    const totalChars = entries.reduce((s, e) => s + (e.content || '').length, 0);
                    if (!entries.length || !totalChars) {
                        console.warn('No code to download');
                        return false;
                    }

                    const zipStem = surveyBuildZipStem(uid, akey, quizId, timestampSeg);

                    if (entries.length === 1) {
                        const e = entries[0];
                        const blob = new Blob([e.content], { type: 'text/plain;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = e.filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        console.log(`✅ Code downloaded as: ${e.filename}`);
                        return true;
                    }

                    if (typeof JSZip === 'undefined') {
                        console.error('JSZip not loaded');
                        return false;
                    }

                    const zip = new JSZip();
                    entries.forEach((ent) => zip.file(ent.filename, ent.content));
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const zipName = `${zipStem}.zip`;
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = zipName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    console.log(`✅ Downloaded ${entries.length} files in ${zipName}`);
                    return true;
                } catch (error) {
                    console.error('Download error:', error);
                    return false;
                }
            }

            restorePeriodicSurveysFromStorage() {
                try {
                    const storageKey = `periodicSurveys_${this.sessionId}`;
                    const savedData = sessionStorage.getItem(storageKey);
                    
                    if (savedData) {
                        const parsedData = JSON.parse(savedData);
                        return {
                            periodic_surveys: parsedData.surveyResponses || [],
                            total_occurrences: parsedData.periodicSurveyOccurrenceCount || 0,
                            total_analyses: parsedData.analysisCount || 0,
                            survey_interval: parsedData.surveyInterval || 4
                        };
                    }
                    return null;
                } catch (error) {
                    console.error('Failed to restore periodic surveys:', error);
                    return null;
                }
            }

            clearPeriodicSurveysFromStorage() {
                try {
                    const storageKey = `periodicSurveys_${this.sessionId}`;
                    sessionStorage.removeItem(storageKey);
                } catch (error) {
                    console.error('Failed to clear surveys:', error);
                }
            }

            showError(message, type = 'error') {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                
                // Red = failed, amber = answer something first, green = done, blue = in progress
                ['success', 'warning', 'info'].forEach((t) => errorDiv.classList.toggle('is-' + t, t === type));
                
                setTimeout(() => errorDiv.style.display = 'none', 8000);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new SurveyManager();
        });
    </script>
</body>
