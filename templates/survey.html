<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - AI Code Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="/static/diagram-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Menlo', 'Ubuntu Mono', monospace;
            background: linear-gradient(135deg, #1e1e1e, #2d2d30, #3e3e42);
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        .survey-container {
            background: linear-gradient(135deg, #252526, #2d2d30);
            border: 2px solid #404040;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .survey-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f97316, #ea580c, #569cd6, #4a86c7);
            background-size: 200% 100%;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Dark scrollbar */
        .survey-container::-webkit-scrollbar {
            width: 8px;
        }

        .survey-container::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }

        .survey-container::-webkit-scrollbar-thumb {
            background: #569cd6;
            border-radius: 4px;
        }

        .survey-container::-webkit-scrollbar-thumb:hover {
            background: #4a86c7;
        }

        .survey-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .survey-header h1 {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #f97316, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .survey-header p {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Full quiz flow: Pre → Coding → Post per problem (from server) */
        .quiz-flow-progress {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #404040;
            border-radius: 10px;
            overflow-x: auto;
        }
        .quiz-flow-progress__inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 6px;
            font-size: 11px;
            line-height: 1.35;
        }
        .quiz-flow-progress__pill {
            padding: 4px 10px;
            border-radius: 999px;
            background: #2d2d30;
            border: 1px solid #404040;
            color: #94a3b8;
            white-space: nowrap;
        }
        .quiz-flow-progress__pill.is-done {
            background: rgba(22, 163, 74, 0.2);
            border-color: #22c55e;
            color: #86efac;
        }
        .quiz-flow-progress__pill.is-active {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #93c5fd;
            font-weight: 600;
        }
        .quiz-flow-progress__sep {
            color: #52525b;
            font-size: 10px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
        #progressPosition { color: #d4d4d4; font-weight: 600; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(64, 64, 64, 0.5);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #404040;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #ea580c, #569cd6);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(64, 64, 64, 0.2);
            border: 1px solid #404040;
            border-radius: 8px;
            border-left: 4px solid #569cd6;
            transition: all 0.3s ease;
        }

        .question:hover {
            background: rgba(64, 64, 64, 0.3);
            border-left-color: #f97316;
        }

        .question.answered {
            border-left-color: #22c55e;
            background: rgba(34, 197, 94, 0.05);
        }

        .question.answered:hover {
            border-left-color: #22c55e;
            background: rgba(34, 197, 94, 0.08);
        }

        .question-label {
            display: block;
            color: #d4d4d4;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .required {
            color: #ef4444;
        }

        /* Help Text */
        .question-help-text {
            color: #888;
            font-size: 11px;
            font-style: italic;
            margin: 8px 0 12px 0;
            padding: 8px 12px;
            background: rgba(64, 64, 64, 0.2);
            border-left: 3px solid #569cd6;
            border-radius: 4px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        .question.answered .question-help-text {
            border-left-color: #22c55e;
        }

        /* Likert Scale */
        .likert-scale {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .likert-option {
            flex: 1;
            text-align: center;
        }

        .likert-option input[type="radio"] {
            display: none;
        }

        .likert-option label {
            display: block;
            padding: 15px 10px;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            border: 2px solid #404040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: #cccccc;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .likert-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border-color: #f97316;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .likert-option label:hover {
            border-color: #569cd6;
            transform: translateY(-2px);
        }

        .likert-option label strong {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .likert-option label small {
            font-size: 10px;
            opacity: 0.8;
        }

        /* Text Input */
        .text-input {
            width: 100%;
            padding: 12px;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #404040;
            border-radius: 8px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
            background: rgba(30, 30, 30, 0.95);
        }

        .text-input::placeholder {
            color: #6c6c6c;
            font-style: italic;
        }

        /* Multiple Choice */
        .multiple-choice {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-option {
            display: flex;
            align-items: center;
            padding: 12px;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            border: 2px solid #404040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-option input[type="checkbox"] { width: 16px; height: 16px; margin: 0 10px 0 0; accent-color: #0a84ff; cursor: pointer; flex-shrink: 0; }
        .other-text {
            width: 100%; margin: 4px 0 8px; padding: 10px 12px; border-radius: 8px;
            background: #1e1e1e; color: #e0e0e0; border: 1px solid #444; font-size: 14px;
        }
        .other-text:focus { outline: none; border-color: #0a84ff; }
        .matrix-wrap { overflow-x: auto; margin-top: 10px; }
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .matrix-table th, .matrix-table td { padding: 10px 8px; border-bottom: 1px solid #333; text-align: center; }
        .matrix-table thead th { color: #aaa; font-weight: 500; font-size: 13px; }
        .matrix-table tbody th { text-align: left; color: #ddd; font-weight: 400; min-width: 160px; }
        .matrix-table td { cursor: pointer; }
        .matrix-table tbody tr:hover { background: rgba(255,255,255,0.03); }
        .matrix-table input[type="radio"] { width: 18px; height: 18px; accent-color: #0a84ff; cursor: pointer; }
        .choice-option:has(input:checked) {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
        }

        .choice-option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #f97316;
        }

        .choice-option label {
            cursor: pointer;
            flex: 1;
            color: #d4d4d4;
            font-size: 14px;
        }

        .choice-option:hover {
            border-color: #569cd6;
            transform: translateX(5px);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .btn-secondary {
            background: transparent;
            color: #d4d4d4;
            border: 1px solid #555;
        }

        .btn-secondary:hover:not(:disabled) { border-color: #888; }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-secondary:disabled::before { display: none; }
        /* ID selectors so these win over the shared theme's blue .btn rules */
        #prevBtn { background: transparent !important; color: #d4d4d4 !important; border: 1px solid #555 !important; }
        #prevBtn:hover:not(:disabled) { background: #2a2a2a !important; border-color: #888 !important; }
        #prevBtn:disabled, #nextBtn:disabled, #submitBtn:disabled {
            background: #3a3a3a !important; color: #777 !important; border: 1px solid #444 !important;
            opacity: 1 !important; cursor: not-allowed !important;
        }

        .button-group { align-items: center; }

        .page-indicator {
            color: #94a3b8;
            font-size: 14px;
            min-width: 48px;
            text-align: center;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #ea580c, #dc2626);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #404040;
        }

        .btn-primary:disabled::before {
            display: none;
        }

        .error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            padding: 15px;
            background: linear-gradient(135deg, #2d1b1b, #3d2222);
            border: 2px solid #ef4444;
            border-radius: 8px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #cccccc;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-radius: 50%;
            border-top-color: #f97316;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        /* Info section at bottom */
        .info-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #404040;
            text-align: center;
        }

        .info-text {
            color: #888;
            font-size: 12px;
            line-height: 1.4;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-top: 10px;
        }

        /* Image Container */
        .question-image-container {
            margin: 15px 0;
            text-align: center;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #404040;
            transition: all 0.3s ease;
            cursor: default;
        }

        .question-image.clickable {
            cursor: pointer;
        }

        .question-image.clickable:hover {
            border-color: #569cd6;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(86, 156, 214, 0.3);
        }

        .question-image.code-background {
            background: #1e1e1e;
            padding: 10px;
        }

        .image-caption {
            display: block;
            margin-top: 8px;
            color: #888;
            font-size: 12px;
            font-style: italic;
        }

        .image-position-above {
            margin-bottom: 15px;
        }

        .image-position-below {
            margin-top: 15px;
        }

        /* Multiple Images Layout */
        .multiple-images {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .multiple-images .question-image {
            max-width: 300px;
        }

        /* Image Loading State */
        .image-loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #404040;
            border-radius: 50%;
            border-top-color: #569cd6;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .image-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 4px;
        }

        /* Survey Header Image */
        .survey-header-image {
            width: 100%;
            max-width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #404040;
        }

        /* Image Modal for Zoom */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            overflow: auto;
        }

        .image-modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal-content {
            max-width: 95%;
            max-height: 95%;
            margin: auto;
            display: block;
            border: 2px solid #569cd6;
            border-radius: 8px;
            animation: modalZoomIn 0.3s ease-out;
        }

        @keyframes modalZoomIn {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10001;
        }

        .image-modal-close:hover {
            color: #f97316;
            transform: scale(1.2);
        }

        /* Character counter for text input */
        .char-counter {
            text-align: right;
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .char-counter.warning {
            color: #f59e0b;
        }

        .char-counter.error {
            color: #ef4444;
        }

        /* ========================================
           NEW QUESTION TYPES STYLES
           ======================================== */

        /* Info Block Question */
        .info-block-question {
            background: rgba(86, 156, 214, 0.1) !important;
            border-left: 4px solid #569cd6 !important;
            padding: 20px;
        }

        .info-block-content {
            color: #d4d4d4;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* 7-point Likert scale with N/A */
        .likert-7-scale {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .likert-7-scale .likert-option {
            flex: 1;
            min-width: 60px;
            max-width: 90px;
        }

        .likert-number {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #569cd6;
        }

        .likert-7-scale .likert-option label {
            min-height: 85px;
            padding: 10px 5px;
        }

        .likert-na-option {
            border-left: 3px solid #f59e0b;
            padding-left: 5px;
            margin-left: 5px;
            background: rgba(245, 158, 11, 0.05);
        }

        .likert-na-option label {
            background: rgba(245, 158, 11, 0.1) !important;
            border-color: #f59e0b !important;
        }

        .likert-na-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            border-color: #f59e0b !important;
        }

        /* Slider styles */
        .slider-container {
            margin: 20px 0;
            padding: 15px;
            background: rgba(64, 64, 64, 0.2);
            border-radius: 8px;
        }

        .slider-value {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #569cd6;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(86, 156, 214, 0.5);
        }

        .slider-input {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #1e1e1e 0%, #569cd6 50%, #f97316 100%);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #ea580c);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.6);
            transition: all 0.3s ease;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.8);
        }

        .slider-input::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #ea580c);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.6);
            transition: all 0.3s ease;
        }

        .slider-input::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.8);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .survey-container {
                padding: 25px 20px;
            }

            .survey-header h1 {
                font-size: 22px;
            }

            .likert-scale {
                flex-direction: column;
            }

            .likert-option label {
                padding: 12px;
                min-height: 50px;
            }

            .btn {
                padding: 12px 30px;
                font-size: 14px;
            }

            .multiple-images {
                flex-direction: column;
            }
            
            .multiple-images .question-image {
                max-width: 100%;
            }
            
            .image-modal-close {
                top: 10px;
                right: 20px;
                font-size: 30px;
            }

            .likert-7-scale {
                gap: 5px;
            }
            
            .likert-7-scale .likert-option {
                min-width: 45px;
                max-width: 70px;
            }
            
            .likert-number {
                font-size: 14px;
            }
            
            .likert-7-scale .likert-option label {
                min-height: 75px;
                padding: 8px 3px;
                font-size: 10px;
            }
            
            .slider-value {
                font-size: 24px;
            }
        }
    </style>
    <style>
{% include 'ui_tokens.css' %}
{% include 'pages_theme.css' %}
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="survey-container">
        <div id="quizFlowProgress" class="quiz-flow-progress" style="display:none;" role="navigation" aria-label="Quiz progress"></div>
        <div class="survey-header">
            <h1 id="surveyTitle">Loading Survey...</h1>
            <p id="surveyDescription"></p>
        </div>

        <div class="progress-label" id="progressLabel" style="display:none;" aria-live="polite">
            <span id="progressPosition"></span>
            <span id="progressCount"></span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="surveyContent" class="loading">
            <div class="spinner"></div>
            <p>Loading survey questions...</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="button-group" id="buttonGroup" style="display: none;">
            <button class="btn btn-secondary" id="prevBtn" type="button" style="display: none;">Back</button>
            <span class="page-indicator" id="pageIndicator"></span>
            <button class="btn btn-primary" id="nextBtn" type="button" style="display: none;">Next</button>
            <button class="btn btn-primary" id="submitBtn">Submit Survey</button>
        </div>
    </div>

    <script>
        // Survey Manager - ALL JavaScript INLINE

        function surveyExtensionForLanguage(language) {
            const languageExtensions = {
                'javascript': '.js', 'python': '.py', 'c': '.c', 'cpp': '.cpp',
                'java': '.java', 'csharp': '.cs', 'html': '.html', 'css': '.css', 'sql': '.sql'
            };
            return languageExtensions[language] || '.txt';
        }

        /** image.src: shared file name → /survey-images/… ; quiz upload → quiz_id/filename → /quiz-images/… */
        function surveyImageUrlFromSrc(src) {
            if (!src || typeof src !== 'string') return '';
            const t = src.trim();
            if (t.indexOf('/') !== -1) {
                const i = t.indexOf('/');
                return '/quiz-images/' + encodeURIComponent(t.slice(0, i)) + '/' + t.slice(i + 1).split('/').map(encodeURIComponent).join('/');
            }
            return '/survey-images/' + encodeURIComponent(t);
        }

        function surveySanitizeIdPart(s) {
            const t = String(s || '').replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80);
            return t || 'participant';
        }

        function surveyDownloadTimestampSegment() {
            return new Date().toISOString().replace(/[:.]/g, '-').replace('T', '_');
        }

        function surveyFetchWithTimeout(url, init, timeoutMs) {
            timeoutMs = timeoutMs || 120000;
            if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
                return fetch(url, Object.assign({}, init || {}, { signal: AbortSignal.timeout(timeoutMs) }));
            }
            var ctrl = new AbortController();
            var tid = setTimeout(function () { ctrl.abort(); }, timeoutMs);
            var p = fetch(url, Object.assign({}, init || {}, { signal: ctrl.signal }));
            p.finally(function () { clearTimeout(tid); });
            return p;
        }

        function surveyBuildStemForProblem(userId, assignmentKey, quizId, problemNumber, timestampSeg) {
            const parts = [surveySanitizeIdPart(userId), surveySanitizeIdPart(assignmentKey)];
            if (quizId) {
                let q = surveySanitizeIdPart(String(quizId));
                if (q.length > 24) q = q.slice(0, 24);
                parts.push('q' + q);
            }
            parts.push('p' + String(problemNumber));
            parts.push(timestampSeg);
            return parts.join('_');
        }

        function surveyBuildZipStem(userId, assignmentKey, quizId, timestampSeg) {
            const parts = [surveySanitizeIdPart(userId), surveySanitizeIdPart(assignmentKey)];
            if (quizId) {
                let q = surveySanitizeIdPart(String(quizId));
                if (q.length > 24) q = q.slice(0, 24);
                parts.push('q' + q);
            }
            parts.push(timestampSeg);
            return parts.join('_');
        }
        
        // Navigation control flag to prevent warning during legitimate redirects
        let allowNavigation = false;
        
        class SurveyManager {
            constructor() {
                this.surveyType = new URLSearchParams(window.location.search).get('type');
                
                // Get auth data from sessionStorage
                const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                this.sessionId = authData.sessionId;
                this.userId = authData.userId;
                this.assignmentKey = authData.assignmentKey;
                // Overwritten in init() from server — stale sessionStorage can point at the wrong problem
                this.problemIndex = authData.currentProblemIndex || 0;

                this.surveyConfig = null;
                this.responses = {};
                /** question id -> DiagramWidget instance (diagram questions) */
                this.diagramWidgets = {};
                this.startTime = Date.now();
                this._surveyDraftSaveTimer = null;
                this._serverSurveyDraftTimer = null;
                
                if (!this.sessionId || !this.userId || !this.assignmentKey) {
                    this.showError('Session expired. Please log in again.');
                    setTimeout(() => window.location.href = '/home.html', 2000);
                    return;
                }
                
                this.init();
            }

            renderQuizFlowProgress(qp) {
                const el = document.getElementById('quizFlowProgress');
                if (!el || !qp || !qp.steps || !qp.steps.length) {
                    if (el) el.style.display = 'none';
                    return;
                }
                const cur = typeof qp.current_step_index === 'number' ? qp.current_step_index : 0;
                const esc = (s) => {
                    if (s == null) return '';
                    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
                };
                let html = '<div class="quiz-flow-progress__inner">';
                for (let idx = 0; idx < qp.steps.length; idx++) {
                    const step = qp.steps[idx];
                    const done = idx < cur;
                    const active = idx === cur;
                    let cls = 'quiz-flow-progress__pill';
                    if (done) cls += ' is-done';
                    if (active) cls += ' is-active';
                    const label = step.short || step.label || ('Step ' + (idx + 1));
                    const tip = step.label || label;
                    html += '<span class="' + cls + '" title="' + esc(tip) + '">' + esc(label) + '</span>';
                    if (idx < qp.steps.length - 1) {
                        html += '<span class="quiz-flow-progress__sep" aria-hidden="true">→</span>';
                    }
                }
                html += '</div>';
                el.innerHTML = html;
                el.style.display = 'block';
            }

            async syncProblemIndexFromServer() {
                if (!this.sessionId) return;
                try {
                    const res = await fetch(
                        '/survey-status/' + encodeURIComponent(this.sessionId) + '?t=' + Date.now(),
                        { cache: 'no-store' }
                    );
                    if (!res.ok) return;
                    const data = await res.json();
                    if (typeof data.current_problem_index === 'number') {
                        this.problemIndex = data.current_problem_index;
                        const ad = JSON.parse(sessionStorage.getItem('authData') || '{}');
                        ad.currentProblemIndex = data.current_problem_index;
                        if (typeof data.total_problems === 'number' && data.total_problems >= 1) {
                            ad.totalProblems = data.total_problems;
                        }
                        sessionStorage.setItem('authData', JSON.stringify(ad));
                    }
                    if (data.quiz_progress && data.quiz_progress.steps && data.quiz_progress.steps.length) {
                        this.renderQuizFlowProgress(data.quiz_progress);
                    }
                } catch (e) {
                    console.warn('syncProblemIndexFromServer:', e);
                }
            }

            async init() {
                try {
                    await this.syncProblemIndexFromServer();
                    await this.loadSurveyConfig();
                    await this.updateSurveyStatus('in_progress');
                    this.renderSurvey();
                    // 1) Server-saved answers (after submit or from last session)
                    await this.applyServerSavedSurveyResponses();
                    // 2) Local draft overrides — in-progress work from this browser
                    this.applySurveyDraftFromStorage();
                    this.setupEventListeners();
                } catch (error) {
                    console.error('Survey initialization error:', error);
                    this.showError('Failed to load survey. Please try again.');
                }
            }

            /** localStorage key: one draft per session + survey type + problem index */
            getSurveyDraftStorageKey() {
                return `surveyDraft_${this.sessionId}_${this.surveyType}_p${this.problemIndex}`;
            }

            /** Same map used for localStorage draft and POST /survey-draft */
            buildDraftResponseMap() {
                const out = { ...this.responses };
                if (!this.surveyConfig || !this.surveyConfig.questions) return out;
                for (const q of this.surveyConfig.questions) {
                    if (q.type !== 'open_ended') continue;
                    const wrap = this.findQuestionElement(q.id);
                    const ta = wrap && wrap.querySelector('textarea.text-input');
                    if (ta && ta.value.length) out[q.id] = ta.value;
                }
                return out;
            }

            persistSurveyDraft() {
                if (!this.sessionId || !this.surveyType || !this.surveyConfig) return;
                try {
                    const out = this.buildDraftResponseMap();
                    localStorage.setItem(
                        this.getSurveyDraftStorageKey(),
                        JSON.stringify({ v: 1, savedAt: Date.now(), responses: out })
                    );
                } catch (e) {
                    console.warn('Survey draft save failed:', e);
                }
            }

            schedulePersistSurveyDraft() {
                if (this._surveyDraftSaveTimer) clearTimeout(this._surveyDraftSaveTimer);
                this._surveyDraftSaveTimer = setTimeout(() => {
                    this._surveyDraftSaveTimer = null;
                    this.persistSurveyDraft();
                }, 300);
                this.scheduleServerSurveyDraft();
            }

            scheduleServerSurveyDraft() {
                if (this._serverSurveyDraftTimer) clearTimeout(this._serverSurveyDraftTimer);
                this._serverSurveyDraftTimer = setTimeout(() => {
                    this._serverSurveyDraftTimer = null;
                    this.flushSurveyDraftToServer(false);
                }, 750);
            }

            flushSurveyDraftToServer(keepalive) {
                if (!this.sessionId || !this.userId || !this.surveyType || !this.surveyConfig) return;
                try {
                    const answers = this.buildDraftResponseMap();
                    const body = JSON.stringify({
                        session_id: this.sessionId,
                        user_id: this.userId,
                        survey_type: this.surveyType,
                        problem_index: this.problemIndex,
                        answers: answers
                    });
                    const init = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: body,
                        keepalive: !!keepalive
                    };
                    fetch('/survey-draft', init).catch(function () {});
                } catch (e) {
                    console.warn('Server survey draft save failed:', e);
                }
            }

            clearSurveyDraft() {
                try {
                    localStorage.removeItem(this.getSurveyDraftStorageKey());
                } catch (e) { /* ignore */ }
            }

            /** Resolve question container without fragile CSS escaping on ids */
            findQuestionElement(questionId) {
                const nodes = document.querySelectorAll('#surveyContent [data-question-id]');
                for (const n of nodes) {
                    if (n.getAttribute('data-question-id') === String(questionId)) return n;
                }
                return null;
            }

            /**
             * Apply a question_id -> answer map to the rendered form and this.responses.
             * Used for server rehydration and localStorage drafts (draft applied last wins on overlap).
             */
            applyResponseMapToForm(saved) {
                if (!this.surveyConfig || !this.surveyConfig.questions || !saved || typeof saved !== 'object') return;
                Object.assign(this.responses, saved);

                for (const q of this.surveyConfig.questions) {
                    if (q.type === 'info_block') continue;
                    let val = saved[q.id];
                    if (val === undefined || val === null) {
                        val = saved[String(q.id)];
                    }
                    if (val === undefined || val === null) continue;

                    const el = this.findQuestionElement(q.id);
                    if (!el) continue;

                    const qidStr = String(q.id);
                    if (q.type === 'diagram') {
                        const w = this.diagramWidgets[qidStr];
                        if (w) w.setAnswer(val);
                        const ans = w ? w.getAnswer() : (val && val.kind === 'diagram' ? val : null);
                        if (!ans) {
                            delete this.responses[q.id];
                            continue;
                        }
                        this.responses[q.id] = ans;
                    } else if (q.type === 'multiple_choice' || q.type === 'checkboxes') {
                        const picked = Array.isArray(val) ? val.map(String) : [String(val)];
                        const otherVal = picked.find((x) => x.startsWith('Other:'));
                        el.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach((inp) => {
                            if (String(inp.name) !== qidStr) return;
                            inp.checked = inp.value === '__other__' ? otherVal !== undefined : picked.includes(String(inp.value));
                        });
                        const otherText = el.querySelector('.other-text');
                        if (otherText) {
                            otherText.value = otherVal !== undefined ? otherVal.replace(/^Other:\s*/, '') : '';
                            otherText.style.display = otherVal !== undefined ? '' : 'none';
                        }
                    } else if (q.type === 'matrix') {
                        if (val && typeof val === 'object') {
                            (q.rows || []).forEach((row, ri) => {
                                el.querySelectorAll(`input[name="${CSS.escape(qidStr + '__r' + ri)}"]`).forEach((inp) => {
                                    inp.checked = val[row] !== undefined && String(inp.value) === String(val[row]);
                                });
                            });
                        }
                    } else if (q.type === 'likert' || q.type === 'likert_7_with_na') {
                        el.querySelectorAll('input[type="radio"]').forEach((radio) => {
                            if (String(radio.name) === qidStr && String(radio.value) === String(val)) radio.checked = true;
                        });
                    } else if (q.type === 'slider') {
                        const slider = el.querySelector('input[type="range"]');
                        if (slider) {
                            slider.value = String(val);
                            const sliderValue = el.querySelector('.slider-value');
                            const scale = q.scale || { unit: '%' };
                            if (sliderValue) {
                                sliderValue.textContent = `${slider.value}${scale.unit || ''}`;
                            }
                        }
                    } else if (q.type === 'open_ended') {
                        const textarea = el.querySelector('textarea.text-input');
                        const charCounter = el.querySelector('.char-counter');
                        if (textarea) {
                            const s = typeof val === 'string' ? val : String(val);
                            textarea.value = s;
                            // Do NOT dispatch synthetic 'input': the open-ended listener deletes
                            // this.responses[id] when below min_length, clearing merged server/draft data.
                            if (charCounter) {
                                const minLength = q.min_length || 0;
                                const maxLen = q.max_length || 1000;
                                const trimmed = s.trim();
                                charCounter.textContent = `${s.length} / ${maxLen} characters${minLength > 0 ? ` (minimum ${minLength})` : ''}`;
                                if (minLength > 0 && trimmed.length < minLength) {
                                    charCounter.className = 'char-counter warning';
                                } else if (s.length > maxLen * 0.9) {
                                    charCounter.className = 'char-counter warning';
                                } else {
                                    charCounter.className = 'char-counter';
                                }
                            }
                        }
                    }

                    el.classList.add('answered');
                }

                this.updateProgress();
            }

            async applyServerSavedSurveyResponses() {
                if (!this.sessionId || !this.surveyConfig) return;
                try {
                    const res = await fetch('/survey-status/' + encodeURIComponent(this.sessionId) + '?t=' + Date.now() + '&problem_index=' + encodeURIComponent(String(this.problemIndex)), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    const field = this.surveyType === 'pre' ? 'pre_survey_answers' : 'post_survey_answers';
                    const saved = data[field];
                    if (!saved || typeof saved !== 'object') return;
                    this.applyResponseMapToForm(saved);
                } catch (e) {
                    console.warn('Could not load saved survey answers from server:', e);
                }
            }

            applySurveyDraftFromStorage() {
                if (!this.surveyConfig || !this.surveyConfig.questions) return;
                let raw;
                try {
                    raw = localStorage.getItem(this.getSurveyDraftStorageKey());
                } catch (e) { return; }
                if (!raw) return;
                let data;
                try {
                    data = JSON.parse(raw);
                } catch (e) { return; }
                if (!data || !data.responses || typeof data.responses !== 'object') return;
                this.applyResponseMapToForm(data.responses);
            }

            async loadSurveyConfig() {
                const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                // Use this.problemIndex (synced from server in init) as the authoritative value
                const problemIndex = typeof this.problemIndex === 'number' ? this.problemIndex : (authData.currentProblemIndex || 0);
                const sid = this.sessionId ? `&session_id=${encodeURIComponent(this.sessionId)}` : '';
                const response = await fetch(`/survey-config/${this.assignmentKey}?problem_index=${problemIndex}${sid}`);
                if (!response.ok) throw new Error('Failed to load survey config');
                
                const config = await response.json();
                
                if (this.surveyType === 'pre') {
                    this.surveyConfig = config.pre_survey;
                } else if (this.surveyType === 'post') {
                    this.surveyConfig = config.post_survey;
                } else {
                    throw new Error('Invalid survey type');
                }

                // Update header - add mandatory message
                document.getElementById('surveyTitle').textContent = this.surveyConfig.title || `${this.surveyType.toUpperCase()} Survey`;
                const descEl = document.getElementById('surveyDescription');
                descEl.textContent = this.surveyConfig.description || '';
                descEl.style.display = descEl.textContent ? '' : 'none';
            }

            renderSurvey() {
                const content = document.getElementById('surveyContent');
                content.className = '';
                content.innerHTML = '';

                // Add header image if present
                if (this.surveyConfig.header_image) {
                    const headerImg = document.createElement('img');
                    headerImg.className = 'survey-header-image';
                    headerImg.dataset.page = '0';
                    headerImg.src = surveyImageUrlFromSrc(this.surveyConfig.header_image.src);
                    headerImg.alt = this.surveyConfig.header_image.alt || 'Survey header';
                    headerImg.onerror = () => {
                        console.error('Header image failed to load');
                        headerImg.remove();
                    };
                    content.appendChild(headerImg);
                }

                // Pages hold at most QUESTIONS_PER_PAGE questions. Large ones (diagrams, grids,
                // questions with an image) get a page alone; an info block opens the page of the
                // question that follows it.
                const QUESTIONS_PER_PAGE = 2;
                const isLarge = (q) => q.type === 'diagram' || q.type === 'matrix' || !!(q.image && q.image.src);
                const countQuestions = (page) => page.filter((q) => q.type !== 'info_block').length;
                this.pages = [];
                let group = null;
                let questionNumber = 1;
                this.surveyConfig.questions.forEach((question) => {
                    const questionDiv = this.createQuestionElement(question, questionNumber - 1);
                    const n = group ? countQuestions(group) : 0;
                    const full = question.type === 'info_block' || isLarge(question)
                        ? n > 0
                        : n >= QUESTIONS_PER_PAGE || (n > 0 && group.some(isLarge));
                    if (!group || full) { group = []; this.pages.push(group); }
                    group.push(question);
                    questionDiv.dataset.page = String(this.pages.length - 1);
                    content.appendChild(questionDiv);
                    
                    // Only increment for actual questions, not info blocks
                    if (question.type !== 'info_block') {
                        questionNumber++;
                    }
                });
                if (!this.pages.length) this.pages.push([]);

                document.getElementById('buttonGroup').style.display = 'flex';
                document.getElementById('submitBtn').disabled = true;
                let savedPage = 0;
                try { savedPage = parseInt(sessionStorage.getItem(this.getPageStorageKey()) || '0', 10) || 0; } catch (e) { /* ignore */ }
                this.showPage(savedPage);
                this.updateProgress();
            }

            getPageStorageKey() {
                return `surveyPage_${this.sessionId}_${this.surveyType}_p${this.problemIndex}`;
            }

            showPage(index) {
                const count = this.pages.length;
                const i = Math.max(0, Math.min(count - 1, index));
                this.currentPage = i;
                document.querySelectorAll('#surveyContent [data-page]').forEach((el) => {
                    el.style.display = Number(el.dataset.page) === i ? '' : 'none';
                });
                const last = i === count - 1;
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                prevBtn.style.display = count > 1 ? '' : 'none';
                nextBtn.style.display = count > 1 ? '' : 'none';
                prevBtn.disabled = i === 0;
                nextBtn.disabled = last;
                document.getElementById('submitBtn').style.display = last ? '' : 'none';
                document.getElementById('pageIndicator').textContent = count > 1 ? `${i + 1} / ${count}` : '';
                try { sessionStorage.setItem(this.getPageStorageKey(), String(i)); } catch (e) { /* ignore */ }
                this.updateProgress();
                requestAnimationFrame(() => this.fitDiagramsToWindow(true));
            }

            /**
             * Shrink the drawing area of diagrams on this page so the question, the whole widget
             * (tools, area, Save) and the Back/Next buttons fit in the window without scrolling.
             * If the page header leaves too little room, fit below the question text and scroll to it.
             */
            fitDiagramsToWindow(scroll) {
                const page = this.pages ? this.pages[this.currentPage] || [] : [];
                const buttons = document.getElementById('buttonGroup');
                page.forEach((q) => {
                    const w = q.type === 'diagram' ? this.diagramWidgets[String(q.id)] : null;
                    if (!w || !w.root || !w.root.offsetHeight || !buttons) return;
                    const box = w.root.getBoundingClientRect();
                    const below = buttons.getBoundingClientRect().bottom - box.bottom + 16;
                    const above = box.top + window.scrollY;
                    let room = window.innerHeight - above - below;
                    const qEl = this.findQuestionElement(q.id);
                    if (qEl) qEl.querySelectorAll('img').forEach((img) => {
                        if (!img.complete && !img.dataset.fitWait) {
                            img.dataset.fitWait = '1';
                            img.addEventListener('load', () => this.fitDiagramsToWindow(false), { once: true });
                        }
                    });
                    if (room < 560 && qEl) {
                        room = window.innerHeight - (box.top - qEl.getBoundingClientRect().top) - below - 8;
                        if (scroll) setTimeout(() => qEl.scrollIntoView({ block: 'start' }), 50);
                    }
                    w.fitHeight(room);
                });
            }

            pageOfQuestion(q) {
                return this.pages.findIndex((page) => page.includes(q));
            }

            isQuestionAnswered(q) {
                const v = this.getAnswerForQuestion(q);
                if (v === undefined || v === null) return false;
                if (typeof v === 'string') {
                    if (!v.trim()) return false;
                    if (q.type === 'open_ended' && q.min_length && v.trim().length < q.min_length) return false;
                }
                return true;
            }

            hideError() {
                const errorDiv = document.getElementById('errorMessage');
                if (errorDiv) errorDiv.style.display = 'none';
            }

            async goToNextPage() {
                const page = this.pages[this.currentPage] || [];
                const missing = page.filter((q) => q.type !== 'info_block' && q.required !== false && !this.isQuestionAnswered(q));
                if (missing.length) {
                    this.showError('Please answer the required questions on this page.', 'warning');
                    const el = this.findQuestionElement(missing[0].id);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.disabled = true;
                try {
                    for (const q of page) {
                        const w = q.type === 'diagram' ? this.diagramWidgets[String(q.id)] : null;
                        if (!w || !w.isDirty() || w.isEmpty()) continue;
                        const answer = await w.save();
                        if (!answer) {
                            this.showError('Your diagram could not be saved. Check your connection and try again.');
                            return;
                        }
                        this.handleResponse(q.id, answer);
                    }
                } finally {
                    nextBtn.disabled = false;
                }
                this.hideError();
                this.showPage(this.currentPage + 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            createQuestionElement(question, index) {
                const div = document.createElement('div');
                
                // Handle info_block differently (no numbering)
                if (question.type === 'info_block') {
                    div.className = 'question info-block-question';
                    div.dataset.questionId = question.id;
                    
                    const content = document.createElement('div');
                    content.className = 'info-block-content';
                    content.innerHTML = question.content || '';
                    div.appendChild(content);
                    
                    // Add image if present
                    if (question.image) {
                        div.appendChild(this.createImageElement(question.image, question.id));
                    }
                    
                    return div; // Return early for info blocks
                }
                
                // Regular question handling
                div.className = 'question';
                div.dataset.questionId = question.id;

                const label = document.createElement('label');
                label.className = 'question-label';
                const isRequired = question.required !== false;
                const requiredMark = isRequired ? '<span class="required">*</span>' : '';
                label.innerHTML = `${index + 1}. ${question.question} ${requiredMark}`;
                div.appendChild(label);

                if (question.help_text) {
                    const helpText = document.createElement('div');
                    helpText.className = 'question-help-text';
                    helpText.textContent = question.help_text;
                    div.appendChild(helpText);
                }

                if (question.image) {
                    div.appendChild(this.createImageElement(question.image, question.id));
                } else if (question.images && Array.isArray(question.images)) {
                    div.appendChild(this.createMultipleImagesElement(question.images, question.id));
                }

                // Add question input based on type
                if (question.type === 'likert') {
                    div.appendChild(this.createLikertScale(question));
                } else if (question.type === 'likert_7_with_na') {
                    div.appendChild(this.createLikert7WithNA(question));
                } else if (question.type === 'slider') {
                    div.appendChild(this.createSlider(question));
                } else if (question.type === 'multiple_choice') {
                    div.appendChild(this.createMultipleChoice(question));
                } else if (question.type === 'checkboxes') {
                    div.appendChild(this.createChoiceList(question, true));
                } else if (question.type === 'matrix') {
                    div.appendChild(this.createMatrix(question));
                } else if (question.type === 'open_ended') {
                    div.appendChild(this.createOpenEnded(question));
                } else if (question.type === 'diagram') {
                    div.appendChild(this.createDiagram(question));
                }

                return div;
            }

            createLikertScale(question) {
                const container = document.createElement('div');
                container.className = 'likert-scale';

                const scale = question.scale || {
                    min: 1,
                    max: 5,
                    minLabel: 'Strongly Disagree',
                    maxLabel: 'Strongly Agree'
                };

                for (let i = scale.min; i <= scale.max; i++) {
                    const option = document.createElement('div');
                    option.className = 'likert-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = i;
                    input.id = `${question.id}_${i}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, i));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    
                    if (i === scale.min) {
                        label.innerHTML = `<strong>${i}</strong><br><small>${scale.minLabel}</small>`;
                    } else if (i === scale.max) {
                        label.innerHTML = `<strong>${i}</strong><br><small>${scale.maxLabel}</small>`;
                    } else {
                        label.innerHTML = `<strong>${i}</strong>`;
                    }

                    option.appendChild(input);
                    option.appendChild(label);
                    container.appendChild(option);
                }

                return container;
            }

            createLikert7WithNA(question) {
                const container = document.createElement('div');
                container.className = 'likert-scale likert-7-scale';

                const scale = question.scale || {
                    min: 1,
                    max: 7,
                    minLabel: 'Strongly Disagree',
                    maxLabel: 'Strongly Agree'
                };

                // Create 7 regular options
                for (let i = scale.min; i <= scale.max; i++) {
                    const option = document.createElement('div');
                    option.className = 'likert-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = i;
                    input.id = `${question.id}_${i}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, i));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    
                    if (i === scale.min) {
                        label.innerHTML = `<div class="likert-number">${i}</div><div class="likert-label">${scale.minLabel}</div>`;
                    } else if (i === scale.max) {
                        label.innerHTML = `<div class="likert-number">${i}</div><div class="likert-label">${scale.maxLabel}</div>`;
                    } else {
                        label.innerHTML = `<div class="likert-number">${i}</div>`;
                    }

                    option.appendChild(input);
                    option.appendChild(label);
                    container.appendChild(option);
                }

                // Add N/A option
                const naOption = document.createElement('div');
                naOption.className = 'likert-option likert-na-option';

                const naInput = document.createElement('input');
                naInput.type = 'radio';
                naInput.name = question.id;
                naInput.value = 'N/A';
                naInput.id = `${question.id}_na`;
                naInput.addEventListener('change', () => this.handleResponse(question.id, 'N/A'));

                const naLabel = document.createElement('label');
                naLabel.htmlFor = naInput.id;
                naLabel.innerHTML = `<div class="likert-label" style="font-weight: bold; padding: 10px;">N/A</div>`;

                naOption.appendChild(naInput);
                naOption.appendChild(naLabel);
                container.appendChild(naOption);

                return container;
            }

            createSlider(question) {
                const container = document.createElement('div');
                container.className = 'slider-container';

                const scale = question.scale || {
                    min: 0,
                    max: 100,
                    step: 5,
                    default: 50,
                    unit: '%'
                };

                const sliderValue = document.createElement('div');
                sliderValue.className = 'slider-value';
                sliderValue.textContent = `${scale.default}${scale.unit || ''}`;

                const slider = document.createElement('input');
                slider.type = 'range';
                slider.id = question.id;
                slider.name = question.id;
                slider.min = scale.min;
                slider.max = scale.max;
                slider.step = scale.step || 1;
                slider.value = scale.default || scale.min;
                slider.className = 'slider-input';

                slider.addEventListener('input', (e) => {
                    const value = e.target.value;
                    sliderValue.textContent = `${value}${scale.unit || ''}`;
                    this.handleResponse(question.id, value);
                });

                // Initialize with default value
                this.handleResponse(question.id, slider.value);

                const sliderLabels = document.createElement('div');
                sliderLabels.className = 'slider-labels';
                sliderLabels.innerHTML = `
                    <span>${scale.min}${scale.unit || ''}</span>
                    <span>${scale.max}${scale.unit || ''}</span>
                `;

                container.appendChild(sliderValue);
                container.appendChild(slider);
                container.appendChild(sliderLabels);

                return container;
            }

            createMultipleChoice(question) {
                return this.createChoiceList(question, false);
            }

            /** Radio (single) or checkbox (multi) list; allow_other adds "Other (please specify)" with a text box. */
            createChoiceList(question, multi) {
                const container = document.createElement('div');
                container.className = 'multiple-choice';
                const qid = String(question.id);
                const choices = (question.options || []).map((o) => ({ value: o, other: false }));
                if (question.allow_other) choices.push({ value: question.other_label || 'Other (please specify)', other: true });

                const otherText = document.createElement('input');
                otherText.type = 'text';
                otherText.className = 'other-text';
                otherText.placeholder = 'Please specify';
                otherText.maxLength = 200;
                otherText.style.display = 'none';

                const inputs = [];
                const update = () => {
                    const otherOn = inputs.some((x) => x.other && x.input.checked);
                    otherText.style.display = otherOn ? '' : 'none';
                    const picked = inputs.filter((x) => x.input.checked)
                        .map((x) => (x.other ? `Other: ${otherText.value.trim()}` : x.value));
                    if (multi) {
                        if (picked.length) this.handleResponse(question.id, picked);
                        else this.clearResponse(question.id);
                    } else if (picked.length) {
                        this.handleResponse(question.id, picked[0]);
                    }
                };

                choices.forEach((choice, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'choice-option';

                    const input = document.createElement('input');
                    input.type = multi ? 'checkbox' : 'radio';
                    input.name = qid;
                    input.value = choice.other ? '__other__' : choice.value;
                    input.id = `${qid}_${index}`;
                    input.addEventListener('change', () => {
                        update();
                        if (choice.other && input.checked) otherText.focus();
                    });

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    label.textContent = choice.value;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);
                    // Whole row is clickable (the label already toggles the input itself)
                    optionDiv.addEventListener('click', (e) => {
                        if (e.target === input || e.target === label) return;
                        input.checked = multi ? !input.checked : true;
                        input.dispatchEvent(new Event('change'));
                    });
                    inputs.push({ input, value: choice.value, other: choice.other });
                    container.appendChild(optionDiv);
                    if (choice.other) container.appendChild(otherText);
                });
                otherText.addEventListener('input', update);
                return container;
            }

            /** Grid: one single-choice answer per row; the answer is { row: column }. */
            createMatrix(question) {
                const wrap = document.createElement('div');
                wrap.className = 'matrix-wrap';
                const table = document.createElement('table');
                table.className = 'matrix-table';
                const rows = question.rows || [];
                const cols = question.columns || [];
                const qid = String(question.id);

                const head = document.createElement('tr');
                head.appendChild(document.createElement('th'));
                cols.forEach((c) => {
                    const th = document.createElement('th');
                    th.textContent = c;
                    head.appendChild(th);
                });
                const thead = document.createElement('thead');
                thead.appendChild(head);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                rows.forEach((row, ri) => {
                    const tr = document.createElement('tr');
                    const rowLabel = document.createElement('th');
                    rowLabel.scope = 'row';
                    rowLabel.textContent = row;
                    tr.appendChild(rowLabel);
                    cols.forEach((col, ci) => {
                        const td = document.createElement('td');
                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `${qid}__r${ri}`;
                        input.value = col;
                        input.id = `${qid}_r${ri}_c${ci}`;
                        input.setAttribute('aria-label', `${row}: ${col}`);
                        input.addEventListener('change', () => {
                            const cur = Object.assign({}, this.responses[question.id] || {});
                            cur[row] = col;
                            this.handleResponse(question.id, cur);
                        });
                        td.addEventListener('click', (e) => {
                            if (e.target === input) return;
                            input.checked = true;
                            input.dispatchEvent(new Event('change'));
                        });
                        td.appendChild(input);
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                wrap.appendChild(table);
                return wrap;
            }

            /** False for partial answers: grid rows left blank, nothing ticked, or "Other" without text. */
            isAnswerComplete(q, v) {
                const otherEmpty = (x) => typeof x === 'string' && /^Other:\s*$/.test(x);
                if (q.type === 'checkboxes') return Array.isArray(v) && v.length > 0 && !v.some(otherEmpty);
                if (q.type === 'multiple_choice') return !otherEmpty(v);
                if (q.type === 'matrix') {
                    if (!v || typeof v !== 'object') return false;
                    return (q.rows || []).every((r) => v[r] !== undefined && v[r] !== null && v[r] !== '');
                }
                return true;
            }

            clearResponse(questionId) {
                delete this.responses[questionId];
                const el = this.findQuestionElement(questionId);
                if (el) el.classList.remove('answered');
                this.updateProgress();
                this.schedulePersistSurveyDraft();
            }

            createOpenEnded(question) {
                const container = document.createElement('div');
                
                const textarea = document.createElement('textarea');
                textarea.className = 'text-input';
                textarea.placeholder = question.placeholder || 'Enter your response here...';
                textarea.maxLength = question.max_length || 1000;
                
                const charCounter = document.createElement('div');
                charCounter.className = 'char-counter';
                const minLength = question.min_length || 0;
                charCounter.textContent = `0 / ${question.max_length || 1000} characters${minLength > 0 ? ` (minimum ${minLength})` : ''}`;
                
                textarea.addEventListener('input', (e) => {
                    const value = e.target.value;
                    const trimmedValue = value.trim();
                    const currentLength = value.length;
                    
                    // Update character counter
                    charCounter.textContent = `${currentLength} / ${question.max_length || 1000} characters${minLength > 0 ? ` (minimum ${minLength})` : ''}`;
                    
                    // Color coding for character counter
                    if (minLength > 0 && trimmedValue.length < minLength) {
                        charCounter.className = 'char-counter warning';
                    } else if (currentLength > (question.max_length || 1000) * 0.9) {
                        charCounter.className = 'char-counter warning';
                    } else {
                        charCounter.className = 'char-counter';
                    }
                    
                    // Validate minimum length (only for real typing — not synthetic events)
                    if (trimmedValue.length >= minLength) {
                        this.handleResponse(question.id, value);
                    } else if (e.isTrusted) {
                        delete this.responses[question.id];
                        this.updateProgress();
                        this.schedulePersistSurveyDraft();
                    }
                });
                
                container.appendChild(textarea);
                container.appendChild(charCounter);
                
                return container;
            }

            createDiagram(question) {
                const container = document.createElement('div');
                if (!window.DiagramWidget) {
                    container.className = 'error-message';
                    container.textContent = 'The drawing tool could not be loaded. Please reload the page.';
                    return container;
                }
                const qid = String(question.id);
                const widget = window.DiagramWidget.mount(container, {
                    question,
                    storageKey: `diagramDraft_${this.sessionId}_${this.surveyType}_p${this.problemIndex}_${qid}`,
                    saveUrl: '/diagram/save',
                    large: true,
                    saveContext: {
                        session_id: this.sessionId,
                        user_id: this.userId,
                        context: this.surveyType,
                        problem_index: this.problemIndex,
                        question_id: qid
                    },
                    onSaved: (answer) => { if (answer) this.handleResponse(question.id, answer); },
                    onChange: () => this.updateProgress()
                });
                this.diagramWidgets[qid] = widget;
                // A diagram saved earlier from this device counts as answered right away.
                if (widget.getAnswer()) this.responses[question.id] = widget.getAnswer();
                return container;
            }

            /** Save every diagram that has unsaved work. Returns false if any save failed. */
            async saveDiagramsBeforeSubmit() {
                for (const qid of Object.keys(this.diagramWidgets)) {
                    const w = this.diagramWidgets[qid];
                    if (!w.isDirty() || w.isEmpty()) continue;
                    const answer = await w.save();
                    if (!answer) return false;
                    this.handleResponse(qid, answer);
                }
                return true;
            }

            createImageElement(imageConfig, questionId) {

                const img = document.createElement('img');
                img.className = 'question-image';
                img.alt = imageConfig.alt || 'Survey question image';
                img.loading = 'eager';
                
                if (imageConfig.width) {
                    img.style.width = imageConfig.width;
                }
                if (imageConfig.max_width) {
                    img.style.maxWidth = imageConfig.max_width;
                }
                if (imageConfig.background) {
                    img.classList.add('code-background');
                    img.style.background = imageConfig.background;
                }
                if (imageConfig.padding) {
                    img.style.padding = imageConfig.padding;
                }
                
                const imageSrc = surveyImageUrlFromSrc(imageConfig.src);

            createMultipleImagesElement(images, questionId) {
                const container = document.createElement('div');
                container.className = 'question-image-container multiple-images';

                images.forEach((imageConfig, index) => {
                    const imgWrapper = document.createElement('div');
                    
                    const img = document.createElement('img');
                    img.className = 'question-image';
                    img.alt = imageConfig.alt || `Image ${index + 1}`;
                    img.src = surveyImageUrlFromSrc(imageConfig.src);
                    img.loading = 'lazy';
                    
                    if (imageConfig.width) img.style.width = imageConfig.width;
                    
                    img.onerror = () => {
                        img.style.display = 'none';
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'image-error';
                        errorDiv.textContent = `Failed to load: ${imageConfig.src}`;
                        imgWrapper.appendChild(errorDiv);
                    };
                    
                    if (imageConfig.zoom || imageConfig.clickable) {
                        img.classList.add('clickable');
                        img.onclick = () => this.openImageModal(img.src, imageConfig.alt);
                    }
                    
                    imgWrapper.appendChild(img);
                    
                    if (imageConfig.caption) {
                        const caption = document.createElement('span');
                        caption.className = 'image-caption';
                        caption.textContent = imageConfig.caption;
